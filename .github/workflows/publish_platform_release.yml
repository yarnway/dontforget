name: Publish verified Android Windows Linux release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main build run containing the distribution-signed Android and desktop packages
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-android-windows-linux
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      revision: ${{ steps.prepare.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Download and verify exact source, archives, signatures and desktop acceptance
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.run_id }}
        run: python scripts/prepare_platform_release.py --run-id "$SOURCE_RUN" --output release-files
      - uses: actions/upload-artifact@v7
        with:
          name: release-ready-${{ github.run_id }}
          path: |
            release-files/*
            release-notes.md
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: release-ready-${{ github.run_id }}
          path: .
      - name: Publish the reviewed three-platform stable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REVISION: ${{ needs.prepare.outputs.revision }}
        run: gh release create "$TAG" release-files/* --target "$REVISION" --title "DontForget $TAG · Android / Windows / Linux" --notes-file release-notes.md --latest
      - name: Verify the published tag, body and every uploaded asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REVISION: ${{ needs.prepare.outputs.revision }}
        run: python scripts/verify_published_release.py --tag "$TAG" --revision "$REVISION" --directory release-files --notes release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: published-release-receipt-${{ github.run_id }}
          path: published-release-receipt.json
          if-no-files-found: error
          retention-days: 90
