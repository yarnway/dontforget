name: Isolated macOS performance harness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Build separate profile entrypoint
        run: bash scripts/build_macos_performance.sh
      - name: Verify harness identity and hash
        run: python3 scripts/verify_artifacts.py dist/performance --platform macos --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-performance-harness
          path: dist/performance/*
          if-no-files-found: error
          retention-days: 30
