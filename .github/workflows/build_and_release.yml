name: Multi-Platform Build & Verify

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.9'
  BYPASS_PERMISSION_LOCATION_ALWAYS: '1'

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --reporter expanded
      - run: python -m unittest discover -s scripts/tests -v

  build:
    name: Build ${{ matrix.platform }} candidate
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2022
          - platform: android
            runner: ubuntu-24.04
          - platform: linux
            runner: ubuntu-24.04
          - platform: macos
            # Keep the standard Intel pool separate from the iOS arm64 pool.
            # Packaging checks every Mach-O for both arm64 and x86_64 slices.
            runner: macos-15-intel
          - platform: ios
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - name: Linux native dependencies
        if: matrix.platform == 'linux'
        timeout-minutes: 12
        run: |
          # The hosted Azure mirror can stream slowly without hitting APT's idle timeout.
          # Hosted runners may reach Azure through mirror+file sources as well.
          # Keep suites, signing keys, and unrelated mirrors unchanged.
          for sources in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors.txt /etc/apt/apt-mirrors-security.txt; do
            if [ -f "$sources" ]; then
              sudo sed -i \
                -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                "$sources"
            fi
          done
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-tools libasound2-dev libayatana-appindicator3-dev at-spi2-core xvfb xauth pulseaudio-utils ffmpeg
          for element in playbin audiopanorama autoaudiosink; do
            gst-inspect-1.0 "$element" >/dev/null
          done
      - name: Windows installer tooling
        if: matrix.platform == 'windows'
        run: choco install innosetup --no-progress -y
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build Windows installer and portable archive
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/package_windows.ps1
      - name: Build Android test-signed packages
        if: matrix.platform == 'android'
        run: bash scripts/build_android.sh
      - name: Build Linux archive
        if: matrix.platform == 'linux'
        run: bash scripts/build_linux.sh
      - name: Build macOS unnotarized archive
        if: matrix.platform == 'macos'
        run: bash scripts/build_macos.sh
      - name: macOS storage lock acceptance
        if: matrix.platform == 'macos'
        run: python -m unittest discover -s scripts/tests -p test_dst_storage_native.py -v
      - name: Build iOS unsigned archive
        if: matrix.platform == 'ios'
        run: bash scripts/build_ios.sh
      - name: Windows install upgrade and uninstall acceptance
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/smoke_windows_installer.ps1
      - name: Linux native startup smoke check
        if: matrix.platform == 'linux'
        run: xvfb-run -a python scripts/smoke_desktop.py --platform linux
      - name: macOS native startup smoke check
        if: matrix.platform == 'macos'
        run: python scripts/smoke_desktop.py --platform macos
      - name: Windows native startup smoke check
        if: matrix.platform == 'windows'
        run: python scripts/smoke_desktop.py --platform windows
      - name: Verify packaged hashes and source identity
        shell: bash
        run: python scripts/verify_artifacts.py dist --platform '${{ matrix.platform }}' --revision "$GITHUB_SHA"
      - name: Upload candidate packages and manifests
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-deliverables
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Preserve failed acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-diagnostics
          path: |
            dist/*-startup.json
            dist/windows-installation.json
          if-no-files-found: ignore
          retention-days: 7

  verify_packages:
    name: Verify tag packages without publishing
    needs: [quality, build]
    runs-on: ubuntu-24.04
    # Keep validation packages in Actions artifacts, including RC tags.
    # Publish stable releases separately after macOS and iOS acceptance.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          path: release-files
          merge-multiple: true
      - name: Verify all platforms belong to this version and commit
        run: python scripts/verify_artifacts.py release-files --revision "$GITHUB_SHA" --tag "$GITHUB_REF_NAME"
