name: Multi-Platform Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --reporter expanded
      - run: python -m unittest discover -s scripts/tests -v

  build:
    name: Build ${{ matrix.platform }} candidate
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2022
          - platform: android
            runner: ubuntu-24.04
          - platform: linux
            runner: ubuntu-24.04
          - platform: macos
            runner: macos-15
          - platform: ios
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - name: Linux native dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libasound2-dev libayatana-appindicator3-dev xvfb pulseaudio-utils ffmpeg
      - name: Windows installer tooling
        if: matrix.platform == 'windows'
        run: choco install innosetup --no-progress -y
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build Windows installer and portable archive
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/package_windows.ps1
      - name: Build Android test-signed packages
        if: matrix.platform == 'android'
        run: bash scripts/build_android.sh
      - name: Build Linux archive
        if: matrix.platform == 'linux'
        run: bash scripts/build_linux.sh
      - name: Build macOS unnotarized archive
        if: matrix.platform == 'macos'
        run: bash scripts/build_macos.sh
      - name: Build iOS unsigned archive
        if: matrix.platform == 'ios'
        run: bash scripts/build_ios.sh
      - name: Windows install upgrade and uninstall acceptance
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/smoke_windows_installer.ps1
      - name: Linux native startup smoke check
        if: matrix.platform == 'linux'
        run: xvfb-run -a python scripts/smoke_desktop.py --platform linux
      - name: macOS native startup smoke check
        if: matrix.platform == 'macos'
        run: python scripts/smoke_desktop.py --platform macos
      - name: Windows native startup smoke check
        if: matrix.platform == 'windows'
        run: python scripts/smoke_desktop.py --platform windows
      - name: Verify packaged hashes and source identity
        shell: bash
        run: python scripts/verify_artifacts.py dist --platform '${{ matrix.platform }}' --revision "$GITHUB_SHA"
      - name: Upload candidate packages and manifests
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-deliverables
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Preserve failed acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-diagnostics
          path: |
            dist/*-startup.json
            dist/windows-installation.json
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Prepare draft release after all packages pass
    needs: [quality, build]
    runs-on: ubuntu-24.04
    # Manual/branch runs build acceptance artifacts only. Publication is separate.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          path: release-files
          merge-multiple: true
      - name: Verify all platforms belong to this version and commit
        run: python scripts/verify_artifacts.py release-files --revision "$GITHUB_SHA" --tag "$GITHUB_REF_NAME"
      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          tag_name: ${{ github.ref_name }}
          name: DontForget ${{ github.ref_name }} candidate
          draft: true
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
